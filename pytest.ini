[pytest]
# Standard entry: python -m pytest   (run from the checkout root)
# The WBS runner executes the same modules by name; see tests/test_test_runner_discovery.py.
testpaths = .
python_files = test_*.py
# Root-level and tests/ files share basenames (e.g. test_plan_check.py), and tests/ has no __init__.py.
# --continue-on-collection-errors: a module that cannot be imported must not hide the rest;
# such modules are listed in tests/known_failures.json (collection_errors) and checked there.
addopts = --import-mode=importlib -ra --continue-on-collection-errors
# tests/ is on the path because some tests import their siblings by bare name (KF-003).
pythonpath = . tests
norecursedirs = .git .claude docs artifact_types __pycache__ node_modules Worktrees
