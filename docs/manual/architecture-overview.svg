<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-label="采来 — サイクル —：モデル・Git・Ollama全体構成図"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466761"/></marker></defs><style>text{font-family:Meiryo,sans-serif;fill:#153d35}.t{font-size:22px;font-weight:bold}.b{font-size:17px}.s{font-size:15px}</style><rect width="1200" height="1080" fill="#f3f7f4"/><text x="30" y="38" class="t">采来 — サイクル — ｜ モデル・引き継ぎ・Git・ローカル判断</text><rect x="15" y="60" width="1170" height="710" rx="16" fill="#edf5f0" stroke="#9bbbae"/><text x="30" y="87" class="s">このPC：ローカル管理・判断・記録</text><rect x="360" y="110" width="480" height="85" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="375" y="140" class="t">利用者：PC ／ スマホ</text><text x="375" y="169" class="b">依頼・範囲確認・回答・承認・結果確認</text><rect x="340" y="240" width="520" height="105" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="355" y="270" class="t">Web UI + ローカルAPI</text><text x="355" y="299" class="b">作業ボード ／ 台帳 ／ チーム設定</text><text x="355" y="324" class="b">スマホは認証付きHTTPS入口を経由</text><polyline points="600,195 600,240" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="615" y="223" class="s">操作</text><rect x="310" y="395" width="580" height="125" rx="9" fill="#dceee3" stroke="#9bbbae"/><text x="325" y="425" class="t">Python統括：server / team_engine</text><text x="325" y="454" class="b">計画 → 調査・実装 → レビュー → 結果確認</text><text x="325" y="479" class="b">担当・モデル切り替え、承認、再試行</text><text x="325" y="504" class="b">次の担当へ：記録・根拠・残作業・対象ソース</text><polyline points="600,345 600,395" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="615" y="377" class="s">UI API</text><rect x="35" y="250" width="240" height="140" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="50" y="280" class="t">共通Agent / Skill</text><text x="50" y="309" class="b">役割・安全境界の定義</text><text x="50" y="334" class="b">メタ情報から選択</text><text x="50" y="359" class="b">必要な本文だけ読込</text><polyline points="275,320 295,320 295,430 310,430" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><rect x="925" y="250" width="240" height="140" rx="9" fill="#e6ecff" stroke="#9bbbae"/><text x="940" y="280" class="t">ローカルOllama</text><text x="940" y="309" class="b">Tev1 判断モデル</text><text x="940" y="334" class="b">Agent選択候補の測定</text><text x="940" y="359" class="b">シャドー：既存判断採用</text><polyline points="890,430 910,430 910,320 925,320" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><polyline points="1045,390 1045,465 890,465" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="933" y="453" class="s">候補・時間・結果</text><rect x="35" y="580" width="330" height="145" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="50" y="610" class="t">SQLite + 設定・履歴</text><text x="50" y="639" class="b">team / handoff / ledger DB</text><text x="50" y="664" class="b">担当報告・利用者判断・残作業</text><text x="50" y="689" class="b">役割・モデル・Provider設定</text><text x="50" y="714" class="b">DB / ZIP / 資料バックアップ</text><rect x="435" y="580" width="330" height="145" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="450" y="610" class="t">プロジェクト + Git</text><text x="450" y="639" class="b">ソース・資料・検証結果</text><text x="450" y="664" class="b">基準コミット・変更差分</text><text x="450" y="689" class="b">未コミット・未追跡も確認</text><text x="450" y="714" class="b">差分を引き継ぎへ活用</text><rect x="835" y="580" width="330" height="145" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="850" y="610" class="t">CLIアダプター</text><text x="850" y="639" class="b">Codex app-server</text><text x="850" y="664" class="b">Claude Code headless</text><text x="850" y="689" class="b">担当ごとの独立セッション</text><text x="850" y="714" class="b">結果・利用量を統括へ</text><polyline points="390,520 200,520 200,580" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><polyline points="600,520 600,580" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="615" y="553" class="s">作業対象</text><polyline points="810,520 1000,520 1000,580" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="902" y="552" class="s">実行 / 報告</text><polyline points="765,635 835,635" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="766" y="625" class="s">参照・変更</text><polyline points="435,690 365,690" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="7 6"/><text x="365" y="679" class="s">差分・根拠</text><text x="35" y="754" class="s">実線：実装の接続 ／ 破線：Git差分を活用する推奨運用（全経路の自動最適化は未確認）</text><rect x="15" y="810" width="1170" height="160" rx="16" fill="#fff2df" stroke="#c7a674"/><text x="35" y="835" class="s">外部AIサービス：CLI経由の開発処理（アカウント利用枠を消費）</text><rect x="40" y="850" width="520" height="95" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="55" y="880" class="t">Codex → OpenAIモデル</text><text x="55" y="909" class="b">GPT系：役割ごとの設定・利用可能な一覧で選択</text><text x="55" y="934" class="b">計画・調査・実装・レビューへ割り当て</text><rect x="640" y="850" width="520" height="95" rx="9" fill="#ffffff" stroke="#9bbbae"/><text x="655" y="880" class="t">Claude Code → Anthropicモデル</text><text x="655" y="909" class="b">Opus / Sonnet等：一覧・実行権限を確認</text><text x="655" y="934" class="b">モデル切り替え時も記録とソースを照合</text><polyline points="975,725 975,790 300,790 300,850" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><polyline points="1030,725 1030,790 900,790 900,850" fill="none" stroke="#466761" stroke-width="2" marker-end="url(#ah)"/><text x="35" y="1003" class="b">削減の狙い：Git差分 + 必要時読込 + 重複整理 → 再提示・再調査を抑える</text><text x="35" y="1034" class="s">引き継ぎはモデル内部記憶の移植ではありません。Git差分の全面自動最適化・削減率は未確認／未測定。</text><text x="35" y="1063" class="s">OllamaはAgent選択のシャドー測定。Lunaは別途認証・課金許可が必要。Decisions APIは未対応。</text></svg>